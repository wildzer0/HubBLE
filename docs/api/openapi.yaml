openapi: 3.0.3
info:
  title: HubBLE firmware API
  version: 1.3.0
  description: |
    REST contract between firmware and web app. The WebSocket events are in `websocket.md`; the same API is also reachable
    over USB (`usb-link.md`). All paths are under `/api/v1`.
    Errors use `{ "error": { "code": "...", "message": "..." } }`.

    State-changing calls (POST) require the header `X-HubBLE: 1` and the documented content type
    (`application/json`, or `application/octet-stream` for the firmware upload). A request with an
    `Origin` header that differs from `Host` is rejected (simple CSRF protection, CLAUDE.md §3.12).
    Access control is the WPA2 Wi-Fi password; there is no separate API login.
servers:
  - url: http://hubble.local
paths:
  /api/v1/status:
    get:
      summary: Dongle status
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /api/v1/ota/status:
    get:
      summary: OTA slots and state
      responses:
        '200':
          description: OTA state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtaStatus' }
  /api/v1/ota/upload:
    post:
      summary: Install a firmware image (streamed to flash)
      description: |
        Body is the raw `.bin` application image. It is written to the inactive slot while it arrives and is
        never buffered in RAM. The image must be an ESP32-S3 application for this board and must pass the
        ESP-IDF checksum/hash validation. On success the dongle reboots about 1.5 s after the response.
        Fails with 409 while the running image is still pending verification.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Installed; the dongle reboots
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  reboot: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/ota/check:
    post:
      summary: 'Check GitHub for an update (`{ channel?: "stable" | "prerelease" }`)'
      description: >
        Starts the background check (joins the saved Wi-Fi network as a station). Poll `GET /ota/status` (`online`) or listen
        to the `ota.state` event. 409 `no_wifi_credentials` when no network is saved; 409 `busy`.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/wifi/scan:
    get:
      summary: Scan for nearby Wi-Fi networks (for choosing the network used for updates)
      description: >
        Blocks for a couple of seconds while the radio scans (the AP stays up, phones may see short stalls). Hidden networks
        are left out, names are deduplicated (strongest access point wins), sorted by signal, at most 20.
        503 `busy` while an update check or a pairing is running, or another scan is in progress.
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        ssid: { type: string }
                        rssi: { type: integer, description: dBm }
                        secure: { type: boolean, description: false for an open network }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/ota/install:
    post:
      summary: 'Install the release found by the last check (`{ allow_downgrade?: bool }`)'
      description: >
        Waits for the physical confirmation when required, downloads over HTTPS, verifies SHA-256 and signature, reboots.
        409 `downgrade_not_confirmed` for an older release without `allow_downgrade`; 409 `nothing_to_install`.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/settings/sta:
    put:
      summary: Save (or forget, with an empty `ssid`) the Wi-Fi network used for updates (`{ ssid, password }`)
      description: Write-only. The response is the settings object, which only says `sta_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, maxLength: 32, description: "Empty forgets the saved network" }
                password: { type: string, maxLength: 63 }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/diagnostics:
    get:
      summary: System diagnostics
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostics' }
  /api/v1/logs:
    get:
      summary: Download the RAM log buffer
      responses:
        '200':
          description: Plain text log (most recent ~16 KB)
          content:
            text/plain:
              schema: { type: string }
  /api/v1/settings/wifi-password:
    post:
      summary: Change the Wi-Fi access point password
      description: |
        10-63 printable ASCII characters, different from the documented default password.
        The AP restarts about 1.5 s later, so connected clients are dropped and must rejoin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10, maxLength: 63 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/reboot:
    post:
      summary: Reboot the dongle
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/reboot-download:
    post:
      summary: Reboot into the ROM USB download mode
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/system/wifi-off:
    post:
      summary: Switch the Wi-Fi access point off now (it stays off until the Ctrl + Alt gesture or a restart)
      description: Refused with 409 `no_bonded_devices` while no device is paired, because the AP is then the only way to pair one.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      summary: Registered (bonded) devices with live state
      description: At most 4 devices (the slot count of the dongle, see `docs/architecture.md`).
      responses:
        '200':
          description: The registered devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
  /api/v1/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, description: "12 hex digits (the address)" } }
    get:
      summary: One device
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: 'Rename (`{ "name": "..." }`)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, description: Longer names are truncated to 31 characters }
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Forget the device and delete its bond
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}/report-map:
    get:
      summary: Raw report map as hex; 409 if the device is not connected
      responses:
        '200':
          description: Report map
          content:
            application/json:
              schema:
                type: object
                properties:
                  hex: { type: string, description: The HID report map, hex encoded }
                  length: { type: integer, description: Length of the report map in bytes }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, description: "12 hex digits (the address)" } }
    get:
      summary: Compatibility report of the device (`docs/api/device-report.schema.json`)
      description: >
        What the dongle learned about the device (identity strings, report map, parser outcome, connection and latency
        figures). It never contains keystrokes, the Bluetooth address, the name the user gave the device or any Wi-Fi data.
        The web app shows it to the user before anything is sent anywhere.
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { type: object, description: "See device-report.schema.json" }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/pairing/scan:
    get:
      summary: Pairing state and the scan list (HID-looking advertisers)
      responses:
        '200':
          description: Pairing state, the full pairing object and the scan results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResponse' }
    post:
      summary: Start a 30 s scan (409 when busy or all four slots are used, 429 when locked)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/pairing/start:
    post:
      summary: Pair with the device picked from the scan; 429 `pairing_locked` after 3 failures
      description: Progress is pushed with the `pairing.*` WebSocket events and is also available from `GET /pairing/scan`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: "12 hex digits, from the scan list" }
                address_type: { type: integer, description: "0 public, 1 random", default: 0 }
                allow_legacy: { type: boolean, description: "Accept legacy pairing (security level red)", default: false }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/pairing/cancel:
    post:
      summary: Cancel scanning / pairing
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/settings:
    get:
      summary: Current settings (never any secret)
      description: The AP times (30..86400 s) and `usb_link` apply from the next restart.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    put:
      summary: Update the given settings fields (all-or-nothing validation)
      description: Send only the fields to change. `sta_configured` is read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: Settings after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/backup:
    get:
      summary: Settings backup; never contains bonds or secrets
      responses:
        '200':
          description: Backup document
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [hubble-backup] }
                  version: { type: integer, example: 1 }
                  settings: { $ref: '#/components/schemas/Settings' }
  /api/v1/restore:
    post:
      summary: Restore a backup document (400 `bad_backup` if it is not one)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "A document returned by GET /backup" }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/system/factory-reset:
    post:
      summary: Erase settings, Wi-Fi password, device registry and bonds, then restart (first-run state)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/debug/input:
    post:
      summary: Inject test input (only in builds with the debug_usb overlay)
      description: >
        Presses/moves as the debug source for `hold_ms` (default 50, max 1000), then releases. `kind` is one of
        `key` (modifiers, keys[]), `mouse` (buttons, dx, dy, wheel, pan), `consumer` (usage), `system` (bits).
        Absent (404) in release builds.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [kind] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/ws:
    get:
      summary: WebSocket upgrade (events and heartbeat)
      description: >
        Not a REST call: upgrades to a WebSocket. Messages are JSON text frames; see `websocket.md` for every event. The
        client heartbeat (`hello`) keeps the Wi-Fi access point on.
      responses:
        '101': { description: Switching protocols }
components:
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Status:
      type: object
      required: [version, board, uptime_s, usb_state, ap_timeout_s, setup_required]
      properties:
        version: { type: string, example: 0.2.0 }
        board: { type: string, example: s3_zero }
        uptime_s: { type: integer }
        usb_state: { type: string, enum: [detached, suspended, configured] }
        ap_timeout_s: { type: integer, nullable: true, description: Seconds until the AP switches off; null when no countdown runs }
        setup_required: { type: boolean, description: True until the Wi-Fi password was changed }
    OtaSlot:
      type: object
      properties:
        slot: { type: string, example: ota_0 }
        version: { type: string, description: Empty if the slot holds no valid image }
    OtaStatus:
      type: object
      properties:
        running: { $ref: '#/components/schemas/OtaSlot' }
        other: { $ref: '#/components/schemas/OtaSlot' }
        pending_verify: { type: boolean }
        rollback_happened: { type: boolean, description: The other slot holds an image that failed and was rolled back }
        boot_failures: { type: integer }
        last_result: { type: string }
        online: { $ref: '#/components/schemas/OnlineUpdate' }
    Partition:
      type: object
      properties:
        label: { type: string }
        address: { type: integer }
        size: { type: integer }
    OnlineUpdate:
      type: object
      description: State of the "check for updates" engine (GitHub)
      properties:
        state: { type: string, enum: [idle, connecting, checking, available, up_to_date, confirm, downloading, installed, error] }
        error:
          type: string
          description: Present when `state` is `error`
          enum: [no_wifi_credentials, wifi_failed, network_error, no_release, bad_manifest, no_board_image, unsigned, too_old, downgrade, confirm_timeout, hash_mismatch, install_failed, busy]
        detail: { type: string, description: Technical reason of a failure, for support }
        wifi_configured: { type: boolean }
        channel: { type: string, enum: [stable, prerelease] }
        release:
          type: object
          description: The release found, when any
          properties:
            version: { type: string }
            min_version: { type: string, description: Oldest running version that may install it directly }
            notes_url: { type: string }
            size: { type: integer, description: Image size in bytes }
            signed: { type: boolean }
            downgrade: { type: boolean, description: True if older than the running version }
        received: { type: integer, description: Bytes downloaded }
        total: { type: integer, description: Bytes to download }
        confirm_remaining_s: { type: integer, description: Seconds left to confirm physically }
    ConnectionParams:
      type: object
      properties:
        interval_ms: { type: number }
        latency: { type: integer }
        timeout_ms: { type: number }
    LatencyStats:
      type: object
      description: BLE notification to USB report queued, microseconds
      properties:
        count: { type: integer }
        min: { type: integer }
        avg: { type: integer }
        p95: { type: integer }
        max: { type: integer }
    Device:
      type: object
      properties:
        id: { type: string, description: "12 hex digits (the address)" }
        slot: { type: integer, minimum: 0, maximum: 3 }
        name: { type: string }
        type: { type: string, enum: [keyboard, pointer, unknown] }
        connected: { type: boolean }
        ready: { type: boolean, description: HID discovery finished and input is forwarded }
        boot_fallback: { type: boolean }
        battery: { type: integer, nullable: true }
        rssi: { type: integer, nullable: true }
        connection: { $ref: '#/components/schemas/ConnectionParams' }
        reconnects: { type: integer }
        last_seen_s: { type: integer }
        latency_us: { $ref: '#/components/schemas/LatencyStats' }
        security: { type: string, enum: [green, yellow, red, unknown] }
    DeviceList:
      type: object
      properties:
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        max: { type: integer, example: 4 }
    Pairing:
      type: object
      properties:
        state: { type: string, enum: [idle, scanning, connecting, pairing, quarantine, confirm, bonded, failed] }
        reason: { type: string, enum: [timeout, cancelled, legacy_rejected, security_failed, no_hid_service, challenge_failed] }
        level: { type: string, enum: [green, yellow, red, unknown] }
        device: { type: string }
        remaining_s: { type: integer }
        lock_remaining_s: { type: integer }
        rx_reports: { type: integer }
        needs_confirmation: { type: boolean }
        passkey: { type: string, description: 6 digits to type on the keyboard }
        challenge:
          type: object
          properties:
            kind: { type: string, enum: [clicks, code] }
            value: { type: string }
            progress: { type: integer }
            length: { type: integer }
    ScanResponse:
      type: object
      properties:
        state: { type: string }
        pairing: { $ref: '#/components/schemas/Pairing' }
        results:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              address_type: { type: integer }
              name: { type: string }
              rssi: { type: integer }
              appearance: { type: integer }
    Settings:
      type: object
      properties:
        require_confirmation: { type: boolean, description: Physical confirmation for new pairings and OTA installs }
        ap_boot_window_s: { type: integer, minimum: 30, maximum: 86400 }
        ap_idle_timeout_s: { type: integer, minimum: 30, maximum: 86400 }
        update_channel: { type: string, enum: [stable, prerelease] }
        sta_configured: { type: boolean, readOnly: true }
        remote_wakeup: { type: boolean }
        portal_auto: { type: boolean, description: Joining the Wi-Fi opens the web app automatically }
        led_brightness: { type: integer, minimum: 0, maximum: 100 }
        status_led: { type: boolean }
        shift_hold_ms: { type: integer, minimum: 1000, maximum: 10000, description: Hold time of the Ctrl + Alt gesture }
        usb_link: { type: boolean, description: USB configuration interface (applied at restart) }
        filter_enabled: { type: boolean }
        filter_bounce_ms: { type: integer, minimum: 0, maximum: 500 }
        filter_hold_ms: { type: integer, minimum: 0, maximum: 1000 }
    SettingsUpdate:
      type: object
      description: Any subset of the writable fields of Settings
      additionalProperties: false
      properties:
        require_confirmation: { type: boolean }
        ap_boot_window_s: { type: integer }
        ap_idle_timeout_s: { type: integer }
        update_channel: { type: string, enum: [stable, prerelease] }
        remote_wakeup: { type: boolean }
        portal_auto: { type: boolean }
        led_brightness: { type: integer }
        status_led: { type: boolean }
        shift_hold_ms: { type: integer }
        usb_link: { type: boolean }
        filter_enabled: { type: boolean }
        filter_bounce_ms: { type: integer }
        filter_hold_ms: { type: integer }
    Diagnostics:
      type: object
      properties:
        uptime_s: { type: integer }
        reset_reason: { type: string }
        heap:
          type: object
          properties:
            free: { type: integer }
            min_free: { type: integer }
            largest_block: { type: integer }
        psram:
          type: object
          properties:
            total: { type: integer }
            free: { type: integer }
        partitions:
          type: object
          properties:
            running: { $ref: '#/components/schemas/Partition' }
            next_update: { $ref: '#/components/schemas/Partition' }
        chip_temp_c: { type: number, description: "Die temperature in degrees Celsius (absent if unreadable)" }
        boot_failures: { type: integer }
        usb_state: { type: string }
        ble:
          type: object
          properties:
            ready: { type: boolean }
            connected: { type: integer }
            bonded: { type: integer }
        power:
          type: object
          properties:
            mode: { type: string, enum: [active, low] }
            remote_wakeup: { type: boolean }
        keyboard_leds: { type: integer, description: Num/Caps/Scroll Lock bits last sent by the host }
        wifi:
          type: object
          properties:
            ssid: { type: string }
            clients: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
