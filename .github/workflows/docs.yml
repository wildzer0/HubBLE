name: Docs

# Deploys the documentation site from main (the github-pages environment only
# accepts deployments from the main branch, not from tags).
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "Doxyfile", "firmware/**/*.[ch]", "webapp/src/**", "webapp/typedoc.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen
      - run: pip install -r docs/requirements.txt
      - run: mkdir -p docs/api/generated/firmware && doxygen Doxyfile
      - run: npm ci && npm run docs
        working-directory: webapp
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
