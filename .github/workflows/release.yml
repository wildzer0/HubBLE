name: Release

# Fast path: CI already ran on the commit being tagged (squash-merged to main),
# so the release only (1) verifies that CI passed, (2) rebuilds the firmware with
# the tag version embedded, one board per parallel job, and (3) publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The seven CI jobs of ci.yml; wait up to ~15 min in case CI on main is still running.
          for _ in $(seq 1 60); do
            ok=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="lint" or .name=="webapp" or .name=="webapp-build" or .name=="fuzz" or .name=="docs" or .name=="host-tests" or .name=="firmware (s3_zero)") | select(.conclusion=="success")] | map(.name) | unique | length')
            bad=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.conclusion=="failure")] | length')
            echo "green jobs: $ok/7, failed: $bad"
            [ "$bad" -gt 0 ] && { echo "CI failed on this commit"; exit 1; }
            [ "$ok" -ge 7 ] && exit 0
            sleep 15
          done
          echo "Timed out waiting for CI"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: true
      matrix:
        board: [s3_zero] # XIAO ESP32-S3 paused, see docs/hardware.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build web app
        working-directory: webapp
        run: npm ci && npm run build
      - name: Build firmware (${{ matrix.board }}) with the tag version
        shell: bash
        env:
          HUBBLE_VERSION_TAG: ${{ github.ref_name }}
          SIGNING_KEY_PEM: ${{ secrets.HUBBLE_SIGNING_KEY }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          export HUBBLE_VERSION="${HUBBLE_VERSION_TAG#v}"
          # The release key lives only in the HUBBLE_SIGNING_KEY secret (docs/key-management.md). The build signs the
          # OTA image with it; a release without the secret must fail instead of falling back to a development key.
          [ -n "$SIGNING_KEY_PEM" ] || { echo "secret HUBBLE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/signing_key.pem"
          export HUBBLE_SIGNING_KEY="$RUNNER_TEMP/signing_key.pem"
          tools/build-firmware.sh ${{ matrix.board }}
          rm -f "$RUNNER_TEMP/signing_key.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.board }}
          path: |
            firmware/build-${{ matrix.board }}/hubble.bin
            firmware/build-${{ matrix.board }}/flash_args
            firmware/build-${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build-${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build-${{ matrix.board }}/ota_data_initial.bin

  # Publishing runs on a plain runner: the ESP-IDF container does not ship the gh CLI.
  publish:
    needs: [verify-ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install esptool==4.13.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: art
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: art-notes
      - name: Assemble assets
        env:
          SIGNING_KEY_PEM: ${{ secrets.HUBBLE_SIGNING_KEY }}
        run: |
          # make_release_assets.py re-verifies every OTA image against the release key before it is published.
          umask 077
          printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/signing_key.pem"
          export HUBBLE_SIGNING_KEY="$RUNNER_TEMP/signing_key.pem"
          # Artifacts keep the firmware/build-<board>/ prefix as their common root is stripped;
          # rebuild the layout expected by make_release_assets.py.
          mkdir -p fw
          for b in s3_zero; do mv "art/build-$b" "fw/build-$b"; done
          python3 tools/make_release_assets.py "${GITHUB_REF_NAME#v}" fw release s3_zero
          rm -f "$RUNNER_TEMP/signing_key.pem"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRE=""
          case "$VERSION" in 0.*|*-rc.*) PRE="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file art-notes/release-notes.md $PRE --verify-tag
      - name: Redeploy the docs site (web installer picks up the new images)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
