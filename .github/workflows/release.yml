name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    # Re-run the full build/test matrix on the tagged commit.
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Derive version and check CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "HUBBLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Fail if the tag and CHANGELOG.md disagree (CLAUDE.md §6.2).
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          # Release notes = the changelog section of this version.
          awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/dist
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build web app
        working-directory: webapp
        run: npm ci && npm run build
      - name: Build firmware for all boards
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          tools/build-firmware.sh all
          python3 tools/make_release_assets.py "$HUBBLE_VERSION" firmware release s3_zero xiao_s3
      # TODO(M6): sign the OTA images here with the key from secrets.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            release/*
            release-notes.md
          if-no-files-found: error

  # Publishing runs on a plain runner: the ESP-IDF container does not ship the gh CLI.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: out
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRE=""
          case "$VERSION" in 0.*|*-rc.*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/release/* --title "$GITHUB_REF_NAME" --notes-file out/release-notes.md $PRE --verify-tag

  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen
      - run: pip install -r docs/requirements.txt
      - run: mkdir -p docs/api/generated/firmware && doxygen Doxyfile
      - run: npm ci && npm run docs
        working-directory: webapp
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
