name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # Longer fuzzing than the per-push smoke run.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_IMAGE: espressif/idf:v5.5.6
  # 1.70 MB = 90 % of the 0x1E0000 OTA slot (CLAUDE.md §4.3)
  FIRMWARE_MAX_BYTES: "1782579"
  WEBAPP_MAX_KB: "150"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: clang-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format cppcheck
          find firmware/main firmware/components firmware/test/unit -name '*.[ch]' -print0 | xargs -0 clang-format --dry-run -Werror
      - name: cppcheck (host-testable components)
        run: |
          cppcheck --enable=warning,style,performance --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --std=c11 \
            -I firmware/components/semver/include -I firmware/components/web_assets/include \
            -I firmware/components/log_buffer/include -I firmware/components/wifi_ap/include \
            -I firmware/components/captive_portal/include -I firmware/components/settings/include \
            -I firmware/components/api/include -I firmware/components/ota/include -I firmware/components/hid_report/include -I firmware/components/hid_parser/include -I firmware/components/hid_normalizer/include -I firmware/components/combo/include -I firmware/components/lat_stats/include -I firmware/components/pairing/include -I firmware/components/ota_manifest/include -I firmware/components/power/include -I firmware/components/led/include \
            firmware/components/semver/semver.c firmware/components/web_assets/web_bundle.c \
            firmware/components/log_buffer/log_buffer.c firmware/components/wifi_ap/ap_policy.c \
            firmware/components/captive_portal/dns_reply.c firmware/components/settings/settings_model.c \
            firmware/components/api/http_guard.c firmware/components/hid_report/hid_report.c firmware/components/hid_parser/hid_parser.c firmware/components/hid_normalizer/hid_normalizer.c firmware/components/combo/combo.c firmware/components/lat_stats/lat_stats.c firmware/components/pairing/pairing.c firmware/components/ota/board_marker.c \
            firmware/components/ota/boot_guard.c firmware/components/ota_manifest/ota_manifest.c firmware/components/power/power_policy.c firmware/components/led/led_pattern.c
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  # The report collection service (Cloudflare Worker): unit tests and types, no deployment.
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Fast: just what the firmware build needs (the checks below run in parallel with the firmware build).
  webapp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_REPORT_URL: ${{ vars.REPORT_URL }} # empty until the collection service is deployed
      - run: npm run size
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: error

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw.outputs.cache-hit == 'true'
      - run: npm run e2e

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cmake -S firmware/test -B firmware/test/build -G Ninja
          cmake --build firmware/test/build
          ctest --test-dir firmware/test/build --output-on-failure -j"$(nproc)"
      - name: Host tests under ASan/LSan/UBSan
        run: |
          cmake -S firmware/test -B firmware/test/build-asan -G Ninja -DHUBBLE_SANITIZE=ON
          cmake --build firmware/test/build-asan
          ctest --test-dir firmware/test/build-asan --output-on-failure -j"$(nproc)"

  # Separate job so the (bounded) fuzzing does not lengthen the critical path.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzzing (libFuzzer, bounded)
        env:
          CC: clang
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang
          tools/fuzz.sh "${{ github.event_name == 'schedule' && 600 || 20 }}"
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            firmware/test/build-fuzz/crash-*
            firmware/test/build-fuzz/work-*
          if-no-files-found: ignore

  firmware:
    needs: webapp-build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        board: [s3_zero] # XIAO ESP32-S3 paused, see docs/hardware.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/dist
      # ccache makes a warm build (only HubBLE sources changed) take a fraction of the cold ESP-IDF compile.
      - name: Cache compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.board }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.board }}-
      - name: Build (${{ matrix.board }})
        shell: bash
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 300M
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          tools/build-firmware.sh ${{ matrix.board }}
          ccache -s | head -5
      - name: Size check
        run: python3 tools/check_firmware_size.py firmware/build-${{ matrix.board }}/hubble.bin "$FIRMWARE_MAX_BYTES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build-${{ matrix.board }}/hubble.bin
            firmware/build-${{ matrix.board }}/bootloader/bootloader.bin
            firmware/build-${{ matrix.board }}/partition_table/partition-table.bin
            firmware/build-${{ matrix.board }}/ota_data_initial.bin

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen
      - run: pip install -r docs/requirements.txt
      - run: mkdir -p docs/api/generated/firmware && doxygen Doxyfile
      - run: npm ci && npm run docs
        working-directory: webapp
      # strict: true in mkdocs.yml fails the build on broken links.
      - run: mkdocs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
